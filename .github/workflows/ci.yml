name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar Python 3.14
        run: uv python install 3.14

      - name: Instalar dependências (com --frozen para build reprodutível)
        run: uv sync --frozen

      - name: Rodar ruff check
        run: uv run ruff check .

      - name: Rodar ruff format --check
        run: uv run ruff format --check .