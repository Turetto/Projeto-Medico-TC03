[project]
name = "projeto-medico-tc03"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.5.3",
    "kagglehub>=1.0.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "requests>=2.34.2",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erros)
    "W",   # pycodestyle (warnings)
    "F",   # pyflakes (erros lógicos, imports não usados etc.)
    "I",   # isort (ordenação de imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade (sintaxe moderna)
    "B",   # flake8-bugbear (bugs comuns)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
